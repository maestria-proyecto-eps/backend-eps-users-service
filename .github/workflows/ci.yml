# CI - backend-eps-users-service
# Runs on PRs targeting develop, qa, main

name: CI

on:
  pull_request:
    branches: [develop, qa, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install flake8 -r requirements.txt
      - run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
      - run: flake8 . --count --max-line-length=120 --statistics --exit-zero

  test:
      name: Tests
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-python@v5
          with:
            python-version: "3.12"
            cache: pip
        - run: pip install -r requirements.txt
        - name: Run tests
          env:
            DB_ADMIN_USER: ${{ secrets.DB_ADMIN_USER }}
            DB_ADMIN_PASSWORD: ${{ secrets.DB_ADMIN_PASSWORD }}
            DB_ADMIN_HOST: ${{ secrets.DB_ADMIN_HOST }}
            DB_ADMIN_PORT: ${{ secrets.DB_ADMIN_PORT }}
            DB_ADMIN_NAME: ${{ secrets.DB_ADMIN_NAME }}
            DB_OP_USER: ${{ secrets.DB_OP_USER }}
            DB_OP_PASSWORD: ${{ secrets.DB_OP_PASSWORD }}
            DB_OP_HOST: ${{ secrets.DB_OP_HOST }}
            DB_OP_PORT: ${{ secrets.DB_OP_PORT }}
            DB_OP_NAME: ${{ secrets.DB_OP_NAME }}
            JWT_SECRET: ${{ secrets.JWT_SECRET }}
            JWT_EXPIRES_MINUTES: ${{ secrets.JWT_EXPIRES_MINUTES }}
            JWT_ALGORITHM: ${{ secrets.JWT_ALGORITHM }}
          run: |
            if [ -d "tests" ] && find tests -name "test_*.py" | grep -q .; then
              pip install pytest
              PYTHONPATH=. pytest tests/ -v
            else
              echo "No tests found — skipping"
            fi
            
  branch-policy:
    name: Branch Policy
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR source branch
        run: |
          TARGET="${{ github.base_ref }}"
          SOURCE="${{ github.head_ref }}"
          echo "PR: $SOURCE → $TARGET"

          # main solo acepta PRs desde qa o hotfix/*
          if [[ "$TARGET" == "main" && "$SOURCE" != "qa" && ! "$SOURCE" =~ ^hotfix/ ]]; then
            echo "❌ PRs a main solo se permiten desde qa o hotfix/*"
            exit 1
          fi

          # qa solo acepta PRs desde develop
          if [[ "$TARGET" == "qa" && "$SOURCE" != "develop" ]]; then
            echo "❌ PRs a qa solo se permiten desde develop"
            exit 1
          fi

          echo "✅ Branch policy OK: $SOURCE → $TARGET"
